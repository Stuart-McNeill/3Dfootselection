<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Interactive 3D Foot</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  body { margin: 0; background: #1c1c1c; color: #f1f1f1; font-family: sans-serif; }
  #ui { position: fixed; top: 10px; left: 10px; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px; }
  #ui button { background: #2b2b2b; color: #f1f1f1; border: 1px solid #3a3a3a; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  #ui button.active { background: #4caf50; color: #fff; }
  #status { position: fixed; top: 10px; right: 10px; background: #2b2b2b; padding: 6px 10px; border-radius: 6px; font-size: 12px; }

  #coords {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: #000a;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      z-index: 20;
  }

  canvas { display: block; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="ui">
  <button id="rotateBtn">Rotate</button>
  <button id="drawBtn">Draw</button>
  <button id="clearBtn">Clear</button>
  <button id="undoBtn">Undo</button>
  <button id="downloadBtn">Download Report</button>
</div>

<div id="status">Loading: idle</div>

<!-- LIVE COORDINATE DISPLAY -->
<div id="coords">Click model to read coordinates…</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

const urls = {
  left: "https://stuart-mcneill.github.io/3Dfootselection/Leftfoot.glb"
};

// ----------------------------
// REGION DEFINITIONS
// ----------------------------
const regions = [
  {
    name: "Left Foot – Dorsal 1st Toe",
    min: { x: -0.130, y: 0.060, z: 0.415 },
    max: { x: -0.060, y: 0.100, z: 0.505 }
  },
  {
    name: "Left Foot – Dorsal 1st MTPJ",
    min: { x: -0.1386, y: 0.0905, z: 0.3046 },
    max: { x: -0.0704, y: 0.1229, z: 0.3592 }
  }
];

let scene, camera, renderer, controls, raycaster, mouse;
let footRoot;
let markerGroup = new THREE.Group();
let modelReady = false;
let mode = "rotate"; 
let clickLog = [];

const statusEl = document.getElementById('status');
const coordsEl = document.getElementById('coords');

function setStatus(t) { statusEl.textContent = t; }

// ----------------------------
// INIT
// ----------------------------
init();
loadFoot();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 100);
  camera.position.set(0, 0.35, 1.2);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.minDistance = 0.15;
  controls.maxDistance = 2.0;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 0.9));
  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(1.5, 2, 1.5);
  scene.add(dir);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();
  scene.add(markerGroup);

  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('click', onClick);

  document.getElementById('rotateBtn').onclick = () => setMode("rotate");
  document.getElementById('drawBtn').onclick = () => setMode("draw");
  document.getElementById('clearBtn').onclick = clearMarkers;
  document.getElementById('undoBtn').onclick = undoMarker;
  document.getElementById('downloadBtn').onclick = downloadReport;

  setMode("rotate");
  animate();
}

function setMode(newMode) {
  mode = newMode;
  controls.enableRotate = (mode === "rotate");

  document.querySelectorAll('#ui button').forEach(btn => btn.classList.remove('active'));
  if (mode === "rotate") document.getElementById('rotateBtn').classList.add('active');
  if (mode === "draw") document.getElementById('drawBtn').classList.add('active');
}

// ----------------------------
// LOAD FOOT MODEL
// ----------------------------
function loadFoot() {
  setStatus(`Loading foot…`);
  modelReady = false;

  if (footRoot) {
    scene.remove(footRoot);
    footRoot.traverse(obj => { if (obj.isMesh && obj.geometry) obj.geometry.dispose(); });
    footRoot = null;
  }

  clearMarkers();

  new GLTFLoader().load(
    urls.left,
    gltf => {
      footRoot = gltf.scene;
      scene.add(footRoot);
      modelReady = true;

      // Draw bounding boxes for regions
      regions.forEach(r => drawBoundingBox(r.min, r.max, 0x00ffff));

      setStatus(`Ready: foot loaded`);
    },
    undefined,
    err => setStatus(`Error loading: ${err.message}`)
  );
}

// ----------------------------
// CLICK HANDLER
// ----------------------------
function onClick(e) {
  if (!modelReady) return;

  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(footRoot, true);
  if (!hits.length) return;

  const hit = hits[0];
  const p = hit.point;

  coordsEl.textContent = `X=${p.x.toFixed(4)}  Y=${p.y.toFixed(4)}  Z=${p.z.toFixed(4)}`;

  if (mode !== "draw") return;

  addMarker(p);
  const regionName = detectRegion(p);

  clickLog.push({
    x: p.x.toFixed(4),
    y: p.y.toFixed(4),
    z: p.z.toFixed(4),
    region: regionName
  });
}

// ----------------------------
// REGION DETECTION
// ----------------------------
function detectRegion(p) {
  for (const r of regions) {
    if (
      p.x >= r.min.x && p.x <= r.max.x &&
      p.y >= r.min.y && p.y <= r.max.y &&
      p.z >= r.min.z && p.z <= r.max.z
    ) {
      return r.name;
    }
  }
  return "Unknown Region";
}

// ----------------------------
// MARKERS
// ----------------------------
function addMarker(pos) {
  const sph = new THREE.Mesh(
    new THREE.SphereGeometry(0.004, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xff4444 })
  );
  sph.position.copy(pos);
  markerGroup.add(sph);
}

function clearMarkers() {
  markerGroup.clear();
  clickLog = [];
}

function undoMarker() {
  if (markerGroup.children.length > 0) {
    markerGroup.remove(markerGroup.children[markerGroup.children.length - 1]);
    clickLog.pop();
  }
}

// ----------------------------
// DOWNLOAD REPORT
// ----------------------------
function downloadReport() {
  if (!clickLog.length) return;

  let report = "Foot Marker Report\n\n";
  clickLog.forEach((p, i) => {
    report += `Marker ${i + 1}: X=${p.x}, Y=${p.y}, Z=${p.z}, Region=${p.region}\n`;
  });

  const blob = new Blob([report], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "foot_markers.txt";
  a.click();
  URL.revokeObjectURL(url);
}

// ----------------------------
// DRAW BOUNDING BOX
// ----------------------------
function drawBoundingBox(min, max, color) {
  const geometry = new THREE.BoxGeometry(
    max.x - min.x,
    max.y - min.y,
    max.z - min.z
  );

  const edges = new THREE.EdgesGeometry(geometry);
  const mat = new THREE.LineBasicMaterial({ color });
  const box = new THREE.LineSegments(edges, mat);

  box.position.set(
    (min.x + max.x) / 2,
    (min.y + max.y) / 2,
    (min.z + max.z) / 2
  );

  scene.add(box);
}

// ----------------------------
// RESIZE & ANIMATE
// ----------------------------
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
</script>
</body>
</html>
