let scene, camera, renderer, controls, raycaster, mouse;
let footRoot;
let markerGroup = new THREE.Group();
let modelReady = false;
let mode = "rotate"; 
let clickLog = [];

const statusEl = document.getElementById('status');
const coordsEl = document.getElementById('coords');

function setStatus(t) { statusEl.textContent = t; }

// ----------------------------
// INIT
// ----------------------------
init();
loadFoot();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 100);
  camera.position.set(0, 0.35, 1.2);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.minDistance = 0.15;
  controls.maxDistance = 2.0;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 0.9));
  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(1.5, 2, 1.5);
  scene.add(dir);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();
  scene.add(markerGroup);

  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('click', onClick);

  document.getElementById('rotateBtn').onclick = () => setMode("rotate");
  document.getElementById('drawBtn').onclick = () => setMode("draw");
  document.getElementById('clearBtn').onclick = clearMarkers;
  document.getElementById('undoBtn').onclick = undoMarker;
  document.getElementById('downloadBtn').onclick = downloadReport;

  setMode("rotate");
  animate();
}

function setMode(newMode) {
  mode = newMode;
  controls.enableRotate = (mode === "rotate");

  document.querySelectorAll('#ui button').forEach(btn => btn.classList.remove('active'));
  if (mode === "rotate") document.getElementById('rotateBtn').classList.add('active');
  if (mode === "draw") document.getElementById('drawBtn').classList.add('active');
}

// ----------------------------
// LOAD FOOT MODEL
// ----------------------------
function loadFoot() {
  setStatus(`Loading foot…`);
  modelReady = false;

  if (footRoot) {
    scene.remove(footRoot);
    footRoot.traverse(obj => { if (obj.isMesh && obj.geometry) obj.geometry.dispose(); });
    footRoot = null;
  }

  clearMarkers();

  new GLTFLoader().load(
    urls.left,
    gltf => {
      footRoot = gltf.scene;
      scene.add(footRoot);
      modelReady = true;

      // Draw bounding boxes for regions
      regions.forEach(r => drawBoundingBox(r.min, r.max, 0x00ffff));

      setStatus(`Ready: foot loaded`);
    },
    undefined,
    err => setStatus(`Error loading: ${err.message}`)
  );
}

// ----------------------------
// CLICK HANDLER
// ----------------------------
function onClick(e) {
  if (!modelReady) return;

  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(footRoot, true);
  if (!hits.length) return;

  const hit = hits[0];
  const p = hit.point;

  coordsEl.textContent = `X=${p.x.toFixed(4)}  Y=${p.y.toFixed(4)}  Z=${p.z.toFixed(4)}`;

  if (mode !== "draw") return;

  addMarker(p);
  const regionName = detectRegion(p);

  clickLog.push({
    x: p.x.toFixed(4),
    y: p.y.toFixed(4),
    z: p.z.toFixed(4),
    region: regionName
  });
}

// ----------------------------
// REGION DETECTION
// ----------------------------
function detectRegion(p) {
  for (const r of regions) {
    if (
      p.x >= r.min.x && p.x <= r.max.x &&
      p.y >= r.min.y && p.y <= r.max.y &&
      p.z >= r.min.z && p.z <= r.max.z
    ) {
      return r.name;
    }
  }
  return "Unknown Region";
}

// ----------------------------
// MARKERS
// ----------------------------
function addMarker(pos) {
  const sph = new THREE.Mesh(
    new THREE.SphereGeometry(0.004, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xff4444 })
  );
  sph.position.copy(pos);
  markerGroup.add(sph);
}

function clearMarkers() {
  markerGroup.clear();
  clickLog = [];
}

function undoMarker() {
  if (markerGroup.children.length > 0) {
    markerGroup.remove(markerGroup.children[markerGroup.children.length - 1]);
    clickLog.pop();
  }
}

// ----------------------------
// DOWNLOAD REPORT
// ----------------------------
function downloadReport() {
  if (!clickLog.length) return;

  let report = "Foot Marker Report\n\n";
  clickLog.forEach((p, i) => {
    report += `Marker ${i + 1}: X=${p.x}, Y=${p.y}, Z=${p.z}, Region=${p.region}\n`;
  });

  const blob = new Blob([report], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "foot_markers.txt";
  a.click();
  URL.revokeObjectURL(url);
}

// ----------------------------
// DRAW BOUNDING BOX
// ----------------------------
function drawBoundingBox(min, max, color) {
  const geometry = new THREE.BoxGeometry(
    max.x - min.x,
    max.y - min.y,
    max.z - min.z
  );

  const edges = new THREE.EdgesGeometry(geometry);
  const mat = new THREE.LineBasicMaterial({ color });
  const box = new THREE.LineSegments(edges, mat);

  box.position.set(
    (min.x + max.x) / 2,
    (min.y + max.y) / 2,
    (min.z + max.z) / 2
  );

  scene.add(box);
}

// ----------------------------
// RESIZE & ANIMATE
// ----------------------------
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
