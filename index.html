<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Interactive 3D Foot</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { margin: 0; background: #1c1c1c; color: #f1f1f1; font-family: sans-serif; }
  #ui { position: fixed; top: 10px; left: 10px; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px; }
  #ui button { background: #2b2b2b; color: #f1f1f1; border: 1px solid #3a3a3a; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  #ui button.active { background: #4caf50; color: #fff; }
  #status { position: fixed; top: 10px; right: 10px; background: #2b2b2b; padding: 6px 10px; border-radius: 6px; font-size: 12px; }
  canvas { display: block; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <button id="rotateBtn">Rotate</button>
  <button id="drawBtn">Draw</button>
  <button id="clearBtn">Clear</button>
  <button id="undoBtn">Undo</button>
  <button id="downloadBtn">Download Report</button>
</div>
<div id="status">Loading: idle</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

const urls = {
  left: "https://stuart-mcneill.github.io/3Dfootselection/Leftfoot.glb"
};

let scene, camera, renderer, controls, raycaster, mouse;
let footRoot;
let markerGroup = new THREE.Group();
let modelReady = false;
let mode = "rotate"; // "rotate" or "draw"
let clickLog = [];
const statusEl = document.getElementById('status');

init();
loadFoot();

function setStatus(t) { statusEl.textContent = t; }

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 100);
  camera.position.set(0, 0.35, 1.2);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.minDistance = 0.15;
  controls.maxDistance = 2.0;

  // Lighting
  scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 0.9));
  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(1.5, 2, 1.5);
  scene.add(dir);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();
  scene.add(markerGroup);

  // Events
  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('click', onClick);

  document.getElementById('rotateBtn').onclick = () => setMode("rotate");
  document.getElementById('drawBtn').onclick = () => setMode("draw");
  document.getElementById('clearBtn').onclick = clearMarkers;
  document.getElementById('undoBtn').onclick = undoMarker;
  document.getElementById('downloadBtn').onclick = downloadReport;

  setMode("rotate");
  animate();
}

function setMode(newMode) {
  mode = newMode;
  controls.enableRotate = (mode === "rotate");
  document.querySelectorAll('#ui button').forEach(btn => btn.classList.remove('active'));
  if (mode === "rotate") document.getElementById('rotateBtn').classList.add('active');
  if (mode === "draw") document.getElementById('drawBtn').classList.add('active');
}

function loadFoot() {
  setStatus(`Loading foot…`);
  modelReady = false;
  if (footRoot) {
    scene.remove(footRoot);
    footRoot.traverse(obj => { if (obj.isMesh && obj.geometry) obj.geometry.dispose(); });
    footRoot = null;
  }
  clearMarkers();

  new GLTFLoader().load(
    urls.left,
    gltf => {
      footRoot = gltf.scene;
      scene.add(footRoot);
      modelReady = true;
      setStatus(`Ready: foot loaded`);
    },
    undefined,
    err => setStatus(`Error loading: ${err.message}`)
  );
}

function onClick(e) {
  if (mode !== "draw" || !modelReady) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(footRoot, true);
  if (!hits.length) return;
  const hit = hits[0];

  addMarker(hit.point);

  const region = mapRegion(hit.point); // simple region mapping (adjust thresholds)
  clickLog.push({
    x: hit.point.x.toFixed(4),
    y: hit.point.y.toFixed(4),
    z: hit.point.z.toFixed(4),
    region
  });
}

function addMarker(pos) {
  const sph = new THREE.Mesh(
    new THREE.SphereGeometry(0.004, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xff4444 })
  );
  sph.position.copy(pos);
  markerGroup.add(sph);
}

// Simple bounding-box region mapping (example thresholds; tune to your model scale/origin)
function mapRegion(point) {
  // Assumes forward is +z, medial is +x for a left foot; adjust as needed.
  if (point.z < -0.05) return "Heel";
  if (point.z > 0.1 && point.x > 0.05) return "1st Toe";
  if (point.z > 0.1 && point.x < -0.05) return "5th Toe";
  if (point.z > 0.02 && Math.abs(point.x) < 0.04) return "Forefoot";
  return "Midfoot";
}

function clearMarkers() {
  markerGroup.clear();
  clickLog = [];
}

function undoMarker() {
  if (markerGroup.children.length > 0) {
    markerGroup.remove(markerGroup.children[markerGroup.children.length - 1]);
    clickLog.pop();
  }
}

function downloadReport() {
  if (!clickLog.length) return;
  let report = "Foot Marker Report\n\n";
  clickLog.forEach((p, i) => {
    report += `Marker ${i + 1}: X=${p.x}, Y=${p.y}, Z=${p.z}, Region=${p.region}\n`;
  });
  const blob = new Blob([report], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "foot_markers.txt";
  a.click();
  URL.revokeObjectURL(url);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
</script>
</body>
</html>
